## FRAMEWORK LOOP DOCUMENTATION
#
# This is a reusable framework loop for sourcing documents from Google Workspace.
#
# **Usage Pattern:**
# Project loops can delegate to this framework loop with custom configuration:
#
# ```yaml
# # Project loop config/ravl.yml
# delegate_to:
#   loop: sourcing/google_docs_sourcing
#   config_overrides:
#     google_documents:
#       - url: "https://docs.google.com/document/d/..."
#         target_path: "./data/output"
#         filename: "document.md"
#         include_revisions: true
# ```
#
# **Features:**
# - Automatic hash-based change detection
# - Markdown export with lineage tracking
# - Optional revision history (simple or full-lineage modes)
# - Metadata .jsonl files with edit history
# - Model persistence with timestamps
# - File recreation if deleted
#
# **Configuration Requirements:**
# Project loops must provide:
# - `google_documents`: List of documents to source
# - `max_google_file_revisions_to_track`: Optional, defaults to 100
# - `allowed_dependencies`: Optional, package whitelist
#
# See README.md for detailed documentation.
