# Self-Healing Data Ingress RAVL Loop Configuration
#
# Copy this file to: ravl_loops/your_api_name/config/ravl.yml
# Edit the values below to match your API
# Note: The loop name is derived from the folder name, no need to specify here

description: Self-healing data ingestion from Your API
emoji: ➿

# ==================== API Configuration ====================

# API endpoint URL
api_endpoint: https://api.example.com/v1

# Authentication method: Bearer, ApiKey, BasicAuth, OAuth2
api_auth_method: Bearer

# Optional: If using ApiKey auth, specify the header name
# (Default: X-API-Key for ApiKey, Authorization for Bearer)
api_auth_header: X-API-Key

# ==================== Context7 Configuration ====================

# Path to API documentation on Context7
# This is used to dynamically understand the API and generate working code
# Format: /websites/{domain_without_tld}/llms.txt
# Example for HiBob: /websites/apidocs_hibob_com/llms.txt
context7_docs_path: /websites/api_example_com/llms.txt

# How long to cache Context7 docs before refreshing (hours)
context7_cache_ttl_hours: 168

# ==================== Strategy & Retry Configuration ====================

# Where to cache the current working strategy
strategy_cache_file: learnings/current_strategy.json

# Maximum number of retry attempts before giving up
max_retry_attempts: 3

# Number of failures before triggering regeneration with alternatives
regenerate_on_failure_count: 2

# Code execution timeout (seconds)
execution_timeout: 300

# ==================== Supported APIs & Credentials ====================

# This template supports multiple APIs. The framework auto-detects which API
# your generated code uses and validates required credentials before execution.
#
# Supported APIs and their required credentials:
#
# Notion:
#   - NOTION_API_KEY
#   - Setup: https://www.notion.com/my-integrations
#
# HiBob:
#   - HIBOB_API_TOKEN
#   - HIBOB_SERVICE_USER_ID
#   - Setup: https://apidocs.hibob.com
#
# Google APIs (Workspace, Sheets, Docs):
#   - GOOGLE_API_KEY or GOOGLE_APPLICATION_CREDENTIALS
#   - Setup: https://developers.google.com/workspace/guides/create-credentials
#
# Generic APIs:
#   - API_KEY, ACCESS_TOKEN, or API-specific credentials
#   - These are passed via environment variables matching the API docs

# ==================== Credential Setup ====================

# Local development: Set environment variables before running the loop
#   export NOTION_API_KEY="your-key"
#   ./.ravl/bin/ravl your_loop --mode full
#
# GitHub Actions: Add as repository secrets
#   Settings → Secrets and variables → Actions → New repository secret
#   Name: NOTION_API_KEY (or your credential name)
#   Value: your-key

# ==================== Template Variables (optional) ====================

# These can be used in your ravl_loop.md with {variable_name} syntax
# If using template variables, each must have: cli_arg, value, description
# Example:
# template_variables:
#   api_name:
#     cli_arg: --api-name
#     value: Example API
#     description: Human-readable name of the API
template_variables: {}

# ==================== Approved Dependencies ====================

# Runtime pip installation whitelist for generated code
# If not specified, falls back to: ravl_loops/config/ravl.yml → .ravl/config/ravl.yml
# Only packages listed here can be installed by generated code (security model)
allowed_dependencies:
  anthropic:
    min_version: '0.25.0'
    max_version: '1.0.0'
  pyyaml:
    min_version: '6.0.1'
    max_version: '7.0.0'
  requests:
    min_version: '2.31.0'
    max_version: '3.0.0'
  google-api-python-client:
    min_version: '2.100.0'
    max_version: '2.120.0'
  google-auth:
    min_version: '2.30.0'
    max_version: '3.0.0'
  google-auth-oauthlib:
    min_version: '1.0.0'
    max_version: '2.0.0'
  google-auth-httplib2:
    min_version: '0.2.0'
    max_version: '1.0.0'
