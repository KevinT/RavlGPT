description = "Self-healing data ingestion from Your API"
emoji = "➿"
strategy_cache_file = "learnings/current_strategy.json"
max_retry_attempts = 3
regenerate_on_failure_count = 2
execution_timeout = 300

[apis.notion]
context7_path = "/websites/developers_notion"

[template_variables]

[allowed_dependencies.anthropic]
min_version = "0.25.0"
max_version = "1.0.0"

[allowed_dependencies.pyyaml]
min_version = "6.0.1"
max_version = "7.0.0"

[allowed_dependencies.requests]
min_version = "2.31.0"
max_version = "3.0.0"

[allowed_dependencies.google-api-python-client]
min_version = "2.100.0"
max_version = "2.120.0"

[allowed_dependencies.google-auth]
min_version = "2.30.0"
max_version = "3.0.0"

[allowed_dependencies.google-auth-oauthlib]
min_version = "1.0.0"
max_version = "2.0.0"

[allowed_dependencies.google-auth-httplib2]
min_version = "0.2.0"
max_version = "1.0.0"
