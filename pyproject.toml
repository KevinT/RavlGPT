[project]
name = "ravl-framework"
version = "0.1.0"
description = "RAVL (Reflect-Act-Verify-Learn) autonomous agent framework for building self-improving loops"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Kevin Trethewey", email = "kevin@sandtech.com"}
]
keywords = ["ai", "agents", "llm", "autonomous", "self-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Core dependencies (minimal - only what framework core needs)
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# LLM provider dependencies
anthropic = ["anthropic>=0.39.0"]
openai = ["openai>=1.0.0"]
google = ["google-generativeai>=0.3.0"]
ollama = ["requests>=2.31.0"]

# Google Workspace integration
google-workspace = [
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
]

# All LLM providers
llm = [
    "anthropic>=0.39.0",
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
    "requests>=2.31.0",
]

# Everything (all optional dependencies)
all = [
    "anthropic>=0.39.0",
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
    "requests>=2.31.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
]

# CLI entry point - single command with subcommand routing
[project.scripts]
ravl = "bin.ravl:main"

[project.urls]
Homepage = "https://github.com/KevinT/RavlGPT"
Documentation = "https://github.com/KevinT/RavlGPT/blob/main/README.md"
Repository = "https://github.com/KevinT/RavlGPT"
Issues = "https://github.com/KevinT/RavlGPT/issues"

# Build system configuration
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Install packages from .ravl/ but make them importable without .ravl prefix
[tool.setuptools.package-dir]
"" = ".ravl"

# Find all packages under .ravl/
[tool.setuptools.packages.find]
where = [".ravl"]

# Include all data files
[tool.setuptools.package-data]
"*" = ["*.yml", "*.yaml", "*.md", "*.txt", "*.sh", "ravl_loops/**/*"]

# UV-specific configuration
[tool.uv]
# Prefer using UV for package installation
dev-dependencies = [
    "pytest>=7.0",
]
