# API Credentials Registry
# Defines correct environment variable names for each data/service API
#
# Users can add new APIs here manually or via: ravl --config (option 2)
#
# Note: This is for data/service APIs only, not LLM providers or MCP servers
# - LLM providers (Anthropic, OpenAI) are configured via option 1
# - MCP servers will be configured via a future option

clickup:
  env_var_names:
    - CLICKUP_API_TOKEN     # Preferred
    - CLICKUP_TOKEN
    - CLICKUP_API_KEY
  preferred: CLICKUP_API_TOKEN
  prompt: "ClickUp API token"
  documentation: https://clickup.com/api/
  auth_type: bearer_token

notion:
  env_var_names:
    - NOTION_API_TOKEN      # Preferred
    - NOTION_TOKEN
    - NOTION_API_KEY
  preferred: NOTION_API_TOKEN
  prompt: "Notion API token"
  documentation: https://developers.notion.com/
  auth_type: bearer_token

github:
  env_var_names:
    - GITHUB_TOKEN          # Preferred
    - GITHUB_API_TOKEN
    - GITHUB_PAT
  preferred: GITHUB_TOKEN
  prompt: "GitHub personal access token"
  documentation: https://docs.github.com/en/authentication
  auth_type: bearer_token

hibob:
  env_var_names:
    - HIBOB_API_TOKEN
  preferred: HIBOB_API_TOKEN
  prompt: "HiBob API token"
  documentation: https://apidocs.hibob.com/
  auth_type: bearer_token
  additional_vars:
    - name: HIBOB_SERVICE_USER_ID
      prompt: "HiBob service user ID"
      required: true

google:
  env_var_names:
    - GOOGLE_CREDENTIALS
  preferred: GOOGLE_CREDENTIALS
  prompt: "Google Workspace credentials (JSON string)"
  documentation: https://cloud.google.com/docs/authentication
  auth_type: service_account_json
  format: "JSON string with client_id, client_secret, refresh_token"

stripe:
  env_var_names:
    - STRIPE_API_KEY
    - STRIPE_SECRET_KEY
  preferred: STRIPE_API_KEY
  prompt: "Stripe API key"
  documentation: https://stripe.com/docs/api
  auth_type: bearer_token
