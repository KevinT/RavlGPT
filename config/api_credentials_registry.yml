# API Credentials Registry
# Defines environment variable names and metadata for each data/service API
#
# Users can add new APIs via: ravl --config (option 2: API Integrations)
#
# Note: This is for data/service APIs only, not LLM providers or MCP servers
# - LLM providers (Anthropic, OpenAI) are configured via option 1
# - MCP servers will be configured via a future option

clickup:
  env_var: CLICKUP_API_TOKEN
  documentation: https://clickup.com/api/
  auth_type: bearer_token

notion:
  env_var: NOTION_API_TOKEN
  documentation: https://developers.notion.com/
  auth_type: bearer_token

github:
  env_var: GITHUB_TOKEN
  documentation: https://docs.github.com/en/authentication
  auth_type: bearer_token

hibob:
  env_var: HIBOB_API_TOKEN
  documentation: https://apidocs.hibob.com/
  auth_type: bearer_token
  additional_vars:
    HIBOB_SERVICE_USER_ID: "Required for API calls"

google:
  env_var: GOOGLE_CREDENTIALS
  documentation: https://cloud.google.com/docs/authentication
  auth_type: service_account_json
  format: "JSON string with client_id, client_secret, refresh_token"

stripe:
  env_var: STRIPE_API_KEY
  documentation: https://stripe.com/docs/api
  auth_type: bearer_token
