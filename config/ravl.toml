description = "Framework-level RAVL configuration"
max_google_file_revisions_to_track = 100

[framework]
required_python_version = "3.14"
min_python_version = "3.9"
max_python_version = "3.14"

[llm.max_tokens]
code_generation = 16384
act_phase_code_generation = 16384
data_ingress_code_generation = 8192
domain_context_synthesis = 4096
verification = 4096
learn_insights = 4096
markdown_enhancement = 4096
health_check_execution_analysis = 4096
health_check_domain_analysis = 4096
default = 8192

[allowed_dependencies.pyyaml]
min_version = "6.0.1"
max_version = "7.0.0"

[allowed_dependencies.requests]
min_version = "2.31.0"
max_version = "3.0.0"

[allowed_dependencies.openpyxl]
min_version = "3.0.0"
max_version = "4.0.0"
